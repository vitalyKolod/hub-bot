name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
      - run: npm run typecheck:api
      - uses: actions/cache@v4
        with:
          path: .cache/mongodb
          key: ${{ runner.os }}-mongodb-8.2.6
      - run: npm run test:api:integration
      - run: npm test
        env:
          ADMIN_GROUP_ID: '100001'
          CONTENT_GROUP_ID: '100002'
          SUPPORT_GROUP_ID: '100003'
          SUNDAY_SCREENS_GROUP_ID: '100004'
          PROP_WAITLIST_THREAD_ID: '100005'
          PROP_STREAM_VERIFY_THREAD_ID: '100006'
